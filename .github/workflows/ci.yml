name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 = Raspberry Pi / Debian 11 target; 3.12 = current
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt ruff
      - name: Lint
        run: ruff check .
      - name: Byte-compile
        run: python -m py_compile solarmon.py growatt.py
      - name: Import check
        run: python -c "import growatt"
